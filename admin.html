<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>福岡トラック掲示板 管理画面</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;
  margin:0;
  color:#222;
}

header{
  background:#111;
  color:#fff;
  padding:20px;
}

header h1{
  margin:0;
  font-size:22px;
}

main{
  max-width:900px;
  margin:20px auto;
  padding:0 14px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input{
  display:block;
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-size:15px;
  cursor:pointer;
}

.login{
  background:#1877f2;
  color:#fff;
}

.logout{
  background:#eee;
}

.delete{
  background:#d93025;
  color:#fff;
  margin-top:16px;
}

.error{
  color:#d93025;
  margin-top:10px;
}

.hidden{
  display:none;
}

.report{
  border:1px solid #ddd;
  border-radius:12px;
  padding:16px;
  margin-top:14px;
}

.label{
  color:#666;
  font-size:12px;
  margin-top:10px;
}

.value{
  word-break:break-word;
}

.notice{
  margin-top:10px;
  font-size:14px;
  color:#555;
}
</style>

</head>

<body>

<header>
  <h1>👑 福岡トラック掲示板 管理画面</h1>
</header>

<main>

<section id="loginArea" class="card">

  <h2>🔐 管理者ログイン</h2>

  <input
    id="email"
    type="email"
    placeholder="メールアドレス"
  >

  <input
    id="password"
    type="password"
    placeholder="パスワード"
  >

  <button class="login" id="loginButton">
    ログイン
  </button>

  <div id="loginError" class="error"></div>

</section>


<section id="adminArea" class="hidden">

  <div class="card">

    <h2>👑 管理者</h2>

    <div id="adminEmail"></div>

    <br>

    <button class="logout" id="logoutButton">
      ログアウト
    </button>

  </div>


  <div class="card">

    <h2>🚨 通報一覧</h2>

    <div id="status">
      読み込み中...
    </div>

    <div id="reports"></div>

  </div>

</section>

</main>


<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://rwhsxtzzpwddkmtjszzc.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_0H09q8OgCLAVQIgQZ_VQkQ_RfPFB_hS";


const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);



/* =========================
   ログイン
========================= */

const loginButton =
document.getElementById("loginButton");


loginButton.addEventListener("click", async () => {

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;

  const errorBox =
  document.getElementById("loginError");

  errorBox.textContent = "";


  if (!email || !password) {

    errorBox.textContent =
    "メールアドレスとパスワードを入力してください。";

    return;
  }


  const result =
  await supabase.auth.signInWithPassword({
    email: email,
    password: password
  });


  if (result.error) {

    console.error(result.error);

    errorBox.textContent =
    "ログインに失敗しました：" +
    result.error.message;

    return;
  }


  const user =
  result.data.user;


  const adminResult =
  await supabase
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();


  if (adminResult.error) {

    errorBox.textContent =
    "管理者確認エラー：" +
    adminResult.error.message;

    return;
  }


  if (!adminResult.data) {

    await supabase.auth.signOut();

    errorBox.textContent =
    "このアカウントは管理者登録されていません。";

    return;
  }


  document
    .getElementById("loginArea")
    .classList.add("hidden");


  document
    .getElementById("adminArea")
    .classList.remove("hidden");


  document
    .getElementById("adminEmail")
    .textContent =
    user.email || "";


  loadReports();

});



/* =========================
   ログアウト
========================= */

document
.getElementById("logoutButton")
.addEventListener("click", async () => {

  await supabase.auth.signOut();

  location.reload();

});



/* =========================
   投稿削除
========================= */

async function deletePost(postId, reportId) {

  if (!confirm(
    "投稿ID " + postId +
    " を削除しますか？\n\n" +
    "この操作は元に戻せません。"
  )) {

    return;
  }


  /* 投稿を削除 */

  const postResult =
  await supabase
    .from("posts")
    .delete()
    .eq("id", postId);


  if (postResult.error) {

    alert(
      "投稿の削除に失敗しました：\n" +
      postResult.error.message
    );

    return;
  }


  /* 通報も削除 */

  const reportResult =
  await supabase
    .from("reports")
    .delete()
    .eq("id", reportId);


  if (reportResult.error) {

    alert(
      "投稿は削除しましたが、" +
      "通報の削除に失敗しました：\n" +
      reportResult.error.message
    );

  }


  /* 一覧を更新 */

  await loadReports();

}



/* =========================
   通報一覧
========================= */

async function loadReports() {

  const status =
  document.getElementById("status");

  const reports =
  document.getElementById("reports");


  status.textContent =
  "読み込み中...";


  const result =
  await supabase
    .from("reports")
    .select("*")
    .order("created_at", {
      ascending:false
    });


  if (result.error) {

    status.textContent =
    "通報の読み込みに失敗しました。";

    reports.innerHTML =
    `<div class="error">
      ${escapeHtml(result.error.message)}
    </div>`;

    return;
  }


  if (
    !result.data ||
    result.data.length === 0
  ) {

    status.textContent =
    "通報はありません。";

    reports.innerHTML = "";

    return;
  }


  status.textContent =
  "通報 " +
  result.data.length +
  "件";


  reports.innerHTML =
  result.data.map(report => `

    <div class="report">

      <div class="label">
        理由
      </div>

      <div class="value">
        ${escapeHtml(report.reason ?? "")}
      </div>


      <div class="label">
        投稿ID
      </div>

      <div class="value">
        ${escapeHtml(String(report.post_id ?? ""))}
      </div>


      <div class="label">
        返信
      </div>

      <div class="value">
        ${escapeHtml(report.reply ?? "")}
      </div>


      <div class="label">
        日時
      </div>

      <div class="value">
        ${escapeHtml(report.created_at ?? "")}
      </div>


      <button
        class="delete"
        data-post-id="${escapeAttr(report.post_id ?? "")}"
        data-report-id="${escapeAttr(report.id ?? "")}"
      >
        🗑️ この投稿を削除
      </button>


      <div class="notice">
        削除すると、この通報も一覧から消えます。
      </div>

    </div>

  `).join("");


  reports
    .querySelectorAll(".delete")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          deletePost(
            button.dataset.postId,
            button.dataset.reportId
          );

        }
      );

    });

}



/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(value) {

  return String(value)
    .replace(/[&<>"]/g, c => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;"

    }[c]));

}


function escapeAttr(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

}

</script>

</body>
</html>
