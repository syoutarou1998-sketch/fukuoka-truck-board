<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>福岡トラック掲示板 管理画面</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;
  margin:0;
  color:#222;
}

header{
  background:#111;
  color:#fff;
  padding:20px;
}

header h1{
  margin:0;
  font-size:22px;
}

main{
  max-width:900px;
  margin:20px auto;
  padding:0 14px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input{
  display:block;
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-size:15px;
  cursor:pointer;
}

.login{
  background:#1877f2;
  color:#fff;
}

.logout{
  background:#eee;
}

.delete{
  background:#d93025;
  color:#fff;
  margin-top:16px;
}

.error{
  color:#d93025;
  margin-top:10px;
}

.hidden{
  display:none;
}

.report{
  border:1px solid #ddd;
  border-radius:12px;
  padding:16px;
  margin-top:14px;
}

.label{
  color:#666;
  font-size:12px;
  margin-top:10px;
}

.value{
  word-break:break-word;
}

.notice{
  margin-top:10px;
  font-size:14px;
  color:#555;
}
</style>

</head>

<body>

<header>
  <h1>👑 福岡トラック掲示板 管理画面</h1>
</header>

<main>

<section id="loginArea" class="card">

  <h2>🔐 管理者ログイン</h2>

  <input
    id="email"
    type="email"
    placeholder="メールアドレス"
  >

  <input
    id="password"
    type="password"
    placeholder="パスワード"
  >

  <button class="login" id="loginButton">
    ログイン
  </button>

  <div id="loginError" class="error"></div>

</section>


<section id="adminArea" class="hidden">

  <div class="card">

    <h2>👑 管理者</h2>

    <div id="adminEmail"></div>

    <br>

    <button class="logout" id="logoutButton">
      ログアウト
    </button>

  </div>


  <div class="card">

    <h2>🚨 通報一覧</h2>

    <div id="status">
      読み込み中...
    </div>

    <div id="reports"></div>

  </div>

</section>

</main>


<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://rwhsxtzzpwddkmtjszzc.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_0H09q8OgCLAVQIgQZ_VQkQ_RfPFB_hS";


const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);



/* =========================
   ログイン
========================= */

const loginButton =
document.getElementById("loginButton");


loginButton.addEventListener("click", async () => {

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;

  const errorBox =
  document.getElementById("loginError");

  errorBox.textContent = "";


  if (!email || !password) {

    errorBox.textContent =
    "メールアドレスとパスワードを入力してください。";

    return;
  }


  const result =
  await supabase.auth.signInWithPassword({
    email: email,
    password: password
  });


  if (result.error) {

    console.error(result.error);

    errorBox.textContent =
    "ログインに失敗しました：" +
    result.error.message;

    return;
  }


  const user =
  result.data.user;


  const adminResult =
  await supabase
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();


  if (adminResult.error) {

    errorBox.textContent =
    "管理者確認エラー：" +
    adminResult.error.message;

    return;
  }


  if (!adminResult.data) {

    await supabase.auth.signOut();

    errorBox.textContent =
    "このアカウントは管理者登録されていません。";

    return;
  }


  document
    .getElementById("loginArea")
    .classList.add("hidden");


  document
    .getElementById("adminArea")
    .classList.remove("hidden");


  document
    .getElementById("adminEmail")
    .textContent =
    user.email || "";


  loadReports();

});



/* =========================
   ログアウト
========================= */

document
.getElementById("logoutButton")
.addEventListener("click", async () => {

  await supabase.auth.signOut();

  location.reload();

});



/* =========================
   投稿削除
========================= */

async function deletePost(postId, reportId) {

  if (!confirm(
    "この投稿を削除しますか？\n\nこの操作は元に戻せません。"
  )) {
    return;
  }

  const postResult = await supabase
    .from("posts")
    .delete()
    .eq("id", postId);

  if (postResult.error) {
    alert(
      "投稿の削除に失敗しました：\n" +
      postResult.error.message
    );
    return;
  }

  const reportResult = await supabase
    .from("reports")
    .delete()
    .eq("id", reportId);

  if (reportResult.error) {
    alert(
      "投稿は削除しましたが、\n" +
      "通報の削除に失敗しました：\n" +
      reportResult.error.message
    );
    return;
  }

  alert("投稿を削除しました！");

  await loadReports();
}


/* =========================
   返信削除
========================= */

async function deleteReply(replyId, reportId) {

  if (!confirm(
    "この返信を削除しますか？\n\nこの操作は元に戻せません。"
  )) {
    return;
  }

  const replyResult = await supabase
    .from("replies")
    .delete()
    .eq("id", replyId);

  if (replyResult.error) {
    alert(
      "返信の削除に失敗しました：\n" +
      replyResult.error.message
    );
    return;
  }

  const reportResult = await supabase
    .from("reports")
    .delete()
    .eq("id", reportId);

  if (reportResult.error) {
    alert(
      "返信は削除しましたが、\n" +
      "通報の削除に失敗しました：\n" +
      reportResult.error.message
    );
    return;
  }

  alert("返信を削除しました！");

  await loadReports();
}


/* =========================
   通報だけ削除
========================= */

async function deleteReport(reportId) {

  if (!confirm(
    "この通報を一覧から削除しますか？"
  )) {
    return;
  }

  const result = await supabase
    .from("reports")
    .delete()
    .eq("id", reportId);

  if (result.error) {
    alert(
      "通報の削除に失敗しました：\n" +
      result.error.message
    );
    return;
  }

  await loadReports();
}


/* =========================
   通報一覧
========================= */

async function loadReports() {

  const status =
    document.getElementById("status");

  const reports =
    document.getElementById("reports");

  status.textContent = "読み込み中...";


  /* 通報一覧 */

  const reportResult = await supabase
    .from("reports")
    .select("*")
    .order("created_at", {
      ascending: false
    });

  if (reportResult.error) {

    status.textContent =
      "通報の読み込みに失敗しました。";

    reports.innerHTML =
      `<div class="error">
        ${escapeHtml(
          reportResult.error.message
        )}
      </div>`;

    return;
  }


  const reportRows =
    reportResult.data || [];


  if (reportRows.length === 0) {

    status.textContent =
      "通報はありません。";

    reports.innerHTML = "";

    return;
  }


  /* 投稿・返信ID */

  const postIds =
    reportRows
      .map(report => report.post_id)
      .filter(id => id !== null);

  const replyIds =
    reportRows
      .map(report => report.reply_id)
      .filter(id => id !== null);


  let posts = [];
  let replies = [];


  /* 投稿取得 */

  if (postIds.length > 0) {

    const result = await supabase
      .from("posts")
      .select("*")
      .in("id", postIds);

    if (result.error) {

      console.error(
        "投稿取得エラー:",
        result.error
      );

    } else {

      posts = result.data || [];

    }
  }


  /* 返信取得 */

  if (replyIds.length > 0) {

    const result = await supabase
      .from("replies")
      .select("*")
      .in("id", replyIds);

    if (result.error) {

      console.error(
        "返信取得エラー:",
        result.error
      );

    } else {

      replies = result.data || [];

    }
  }


  /* IDで検索できるようにする */

  const postMap = new Map(
    posts.map(post => [
      String(post.id),
      post
    ])
  );

  const replyMap = new Map(
    replies.map(reply => [
      String(reply.id),
      reply
    ])
  );


  status.textContent =
    "通報 " +
    reportRows.length +
    "件";


  /* 通報カード */

  reports.innerHTML =
    reportRows.map(report => {

      const reportId =
        String(report.id);


      /* =========================
         投稿への通報
      ========================= */

      if (report.post_id !== null) {

        const post =
          postMap.get(
            String(report.post_id)
          );


        /* 投稿がすでに削除されている */

        if (!post) {

          return `

            <div class="report">

              <strong>
                🚨 投稿への通報
              </strong>

              <div class="label">
                理由
              </div>

              <div class="value">
                ${escapeHtml(
                  report.reason ?? ""
                )}
              </div>

              <div class="label">
                通報者
              </div>

              <div class="value">
                ${escapeHtml(
                  report.reporter_name ?? "匿名"
                )}
              </div>

              <div class="label">
                投稿
              </div>

              <div class="value">
                投稿はすでに削除されています。
              </div>

              <button
                class="delete-report"
                data-report-id="${escapeAttr(
                  reportId
                )}"
              >
                🗑️ 通報を削除
              </button>

            </div>

          `;
        }


        return `

          <div class="report">

            <strong>
              🚨 投稿への通報
            </strong>

            <div class="label">
              通報理由
            </div>

            <div class="value">
              ${escapeHtml(
                report.reason ?? ""
              )}
            </div>

            <div class="label">
              通報者
            </div>

            <div class="value">
              ${escapeHtml(
                report.reporter_name ?? "匿名"
              )}
            </div>

            <div class="label">
              投稿タイトル
            </div>

            <div class="value">
              ${escapeHtml(
                post.title ?? ""
              )}
            </div>

            <div class="label">
              投稿者
            </div>

            <div class="value">
              ${escapeHtml(
                post.author ?? "名無し"
              )}
            </div>

            <div class="label">
              投稿内容
            </div>

            <div class="value">
              ${escapeHtml(
                post.body ?? ""
              )}
            </div>

            <div class="label">
              通報日時
            </div>

            <div class="value">
              ${escapeHtml(
                report.created_at ?? ""
              )}
            </div>

            <button
              class="delete"
              data-post-id="${escapeAttr(
                String(post.id)
              )}"
              data-report-id="${escapeAttr(
                reportId
              )}"
            >
              🗑️ この投稿を削除
            </button>

            <button
              class="delete-report"
              data-report-id="${escapeAttr(
                reportId
              )}"
            >
              ✓ 通報だけ削除
            </button>

          </div>

        `;
      }


      /* =========================
         返信への通報
      ========================= */

      if (report.reply_id !== null) {

        const reply =
          replyMap.get(
            String(report.reply_id)
          );


        /* 返信がすでに削除されている */

        if (!reply) {

          return `

            <div class="report">

              <strong>
                🚨 返信への通報
              </strong>

              <div class="label">
                理由
              </div>

              <div class="value">
                ${escapeHtml(
                  report.reason ?? ""
                )}
              </div>

              <div class="label">
                通報者
              </div>

              <div class="value">
                ${escapeHtml(
                  report.reporter_name ?? "匿名"
                )}
              </div>

              <div class="label">
                返信
              </div>

              <div class="value">
                返信はすでに削除されています。
              </div>

              <button
                class="delete-report"
                data-report-id="${escapeAttr(
                  reportId
                )}"
              >
                🗑️ 通報を削除
              </button>

            </div>

          `;
        }


        return `

          <div class="report">

            <strong>
              🚨 返信への通報
            </strong>

            <div class="label">
              通報理由
            </div>

            <div class="value">
              ${escapeHtml(
                report.reason ?? ""
              )}
            </div>

            <div class="label">
              通報者
            </div>

            <div class="value">
              ${escapeHtml(
                report.reporter_name ?? "匿名"
              )}
            </div>

            <div class="label">
              返信者
            </div>

            <div class="value">
              ${escapeHtml(
                reply.author ?? "名無し"
              )}
            </div>

            <div class="label">
              返信内容
            </div>

            <div class="value">
              ${escapeHtml(
                reply.body ?? ""
              )}
            </div>

            <div class="label">
              通報日時
            </div>

            <div class="value">
              ${escapeHtml(
                report.created_at ?? ""
              )}
            </div>

            <button
              class="delete"
              data-reply-id="${escapeAttr(
                String(reply.id)
              )}"
              data-report-id="${escapeAttr(
                reportId
              )}"
            >
              🗑️ この返信を削除
            </button>

            <button
              class="delete-report"
              data-report-id="${escapeAttr(
                reportId
              )}"
            >
              ✓ 通報だけ削除
            </button>

          </div>

        `;
      }


      return "";

    }).join("");


  /* 投稿削除ボタン */

  reports
    .querySelectorAll(
      ".delete[data-post-id]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          deletePost(
            button.dataset.postId,
            button.dataset.reportId
          );

        }
      );

    });


  /* 返信削除ボタン */

  reports
    .querySelectorAll(
      ".delete[data-reply-id]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          deleteReply(
            button.dataset.replyId,
            button.dataset.reportId
          );

        }
      );

    });


  /* 通報だけ削除 */

  reports
    .querySelectorAll(
      ".delete-report"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          deleteReport(
            button.dataset.reportId
          );

        }
      );

    });

}



/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(value) {

  return String(value)
    .replace(/[&<>"]/g, c => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;"

    }[c]));

}


function escapeAttr(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

}

</script>

</body>
</html>
