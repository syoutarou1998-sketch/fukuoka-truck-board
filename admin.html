<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福岡トラック掲示板｜管理者</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
    "Yu Gothic", Meiryo, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 20px;
  text-align: center;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 16px;
}

.card {
  background: white;
  padding: 18px;
  margin-bottom: 16px;
  border-radius: 14px;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  margin: 6px 0 12px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 16px;
}

button {
  padding: 12px 16px;
  border: 0;
  border-radius: 9px;
  font-weight: bold;
  font-size: 15px;
}

.login {
  width: 100%;
  background: #2563eb;
  color: white;
}

.logout {
  background: #e5e7eb;
}

.hidden {
  display: none;
}

.error {
  color: #b91c1c;
  margin-top: 10px;
}

.report {
  border: 1px solid #ddd;
  padding: 14px;
  margin-top: 12px;
  border-radius: 10px;
}

.label {
  color: #666;
  font-size: 12px;
  margin-top: 10px;
}

.value {
  word-break: break-word;
}
</style>
</head>

<body>

<header>
  <h1>👑 福岡トラック掲示板 管理画面</h1>
</header>

<main>

<section id="loginArea" class="card">
  <h2>🔐 管理者ログイン</h2>

  <input id="email" type="email" placeholder="メールアドレス">

  <input id="password" type="password" placeholder="パスワード">

  <button class="login" id="loginButton">
    ログイン
  </button>

  <div id="loginError" class="error"></div>
</section>

<section id="adminArea" class="hidden">

  <div class="card">
    <h2>👑 管理者</h2>

    <div id="adminEmail"></div>

    <br>

    <button class="logout" id="logoutButton">
      ログアウト
    </button>
  </div>

  <div class="card">
    <h2>🚨 通報一覧</h2>

    <div id="status">読み込み中...</div>

    <div id="reports"></div>
  </div>

</section>

</main>

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://rwhsxtzzpwddkmtjszzc.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_0H09q8OgCLAVQIgQZ_VQkQ_RfPFB_hS";


const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


const loginButton =
document.getElementById("loginButton");


loginButton.addEventListener("click", async () => {

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;

  const errorBox =
  document.getElementById("loginError");

  errorBox.textContent = "";


  if (!email || !password) {

    errorBox.textContent =
    "メールアドレスとパスワードを入力してください。";

    return;
  }


  const result =
  await supabase.auth.signInWithPassword({
    email: email,
    password: password
  });


  if (result.error) {

    console.error(result.error);

    errorBox.textContent =
    "ログインに失敗しました：" +
    result.error.message;

    return;
  }


  const user =
  result.data.user;


  const adminResult =
  await supabase
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();


  if (adminResult.error) {

    errorBox.textContent =
    "管理者確認エラー：" +
    adminResult.error.message;

    return;
  }


  if (!adminResult.data) {

    await supabase.auth.signOut();

    errorBox.textContent =
    "このアカウントは管理者登録されていません。";

    return;
  }


  document
    .getElementById("loginArea")
    .classList.add("hidden");

  document
    .getElementById("adminArea")
    .classList.remove("hidden");

  document
    .getElementById("adminEmail")
    .textContent =
    user.email || "";

  loadReports();

});


document
.getElementById("logoutButton")
.addEventListener("click", async () => {

  await supabase.auth.signOut();

  location.reload();

});


async function loadReports() {

  const status =
  document.getElementById("status");

  const reports =
  document.getElementById("reports");


  const result =
  await supabase
    .from("reports")
    .select("*")
    .order("created_at", {
      ascending: false
    });


  if (result.error) {

    status.textContent =
    "通報の読み込みに失敗しました。";

    reports.innerHTML =
    `<div class="error">
      ${result.error.message}
    </div>`;

    return;
  }


  if (!result.data || result.data.length === 0) {

    status.textContent =
    "通報はありません。";

    return;
  }


  status.textContent =
  "通報 " + result.data.length + "件";


  reports.innerHTML =
  result.data.map(report => `

    <div class="report">

      <div class="label">理由</div>
      <div class="value">${report.reason ?? ""}</div>

      <div class="label">投稿ID</div>
      <div class="value">${report.post_id ?? ""}</div>

      <div class="label">返信</div>
      <div class="value">${report.reply ?? ""}</div>

      <div class="label">日時</div>
      <div class="value">${report.created_at ?? ""}</div>

    </div>

  `).join("");

}

</script>

</body>
</html>
