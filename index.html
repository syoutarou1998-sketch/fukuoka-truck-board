<style>/* =================================================
   🚛 全国トラック掲示板
   PREMIUM BLACK × EMERALD
================================================= */

:root{
  --main:#10b981;
  --main-light:#34d399;
  --main-dark:#047857;
  --bg:#050908;
  --panel:#0c1712;
  --panel2:#10221a;
  --border:#1b5743;
  --text:#f2fff9;
  --sub:#a8c8bd;
}

/* ===== 全体 ===== */

body{
  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(16,185,129,.18),
      transparent 38%
    ),
    linear-gradient(
      180deg,
      #06100d 0%,
      #08150f 45%,
      #030706 100%
    );

  color:var(--text);
}


/* ===== ヘッダー ===== */

header{
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% -30%,
      rgba(52,211,153,.28),
      transparent 55%
    ),
    linear-gradient(
      135deg,
      #040b08,
      #0b2118 50%,
      #040b08
    );

  padding:34px 18px 30px;

  border-bottom:1px solid rgba(52,211,153,.45);

  box-shadow:
    0 10px 35px rgba(0,0,0,.5);
}


/* ヘッダーにトラックマーク */

header h1::before{
  content:"🚛";
  margin-right:10px;
  font-size:30px;
  filter:drop-shadow(0 3px 8px rgba(16,185,129,.35));
}


/* タイトル */

header h1{
  margin:0 0 10px;

  font-size:28px;
  font-weight:950;
  letter-spacing:.5px;

  color:#ffffff;

  text-shadow:
    0 0 15px rgba(52,211,153,.25);
}


/* タイトルの「全国」 */

header h1::after{
  content:"";
}


/* 説明 */

header p{
  color:#b9d8ce;
  opacity:1;
  font-size:13px;
  font-weight:600;
}


/* ===== メイン ===== */

.container{
  max-width:720px;
  padding:18px;
}


/* ===== 投稿ボタン ===== */

.post-button{

  background:
    linear-gradient(
      135deg,
      #036b4a 0%,
      #0b9f69 45%,
      #20d890 100%
    );

  color:white;

  border:1px solid rgba(255,255,255,.18);

  border-radius:16px;

  padding:18px;

  font-size:19px;
  font-weight:950;

  box-shadow:
    0 9px 28px rgba(16,185,129,.28),
    inset 0 1px 0 rgba(255,255,255,.25);

  transition:.2s;
}

.post-button:active{
  transform:scale(.98);
}


/* ===== 検索ボックス ===== */

.search-box{

  background:
    linear-gradient(
      145deg,
      rgba(17,35,27,.98),
      rgba(7,15,11,.98)
    );

  border:1px solid var(--border);

  border-radius:18px;

  padding:14px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.3);
}


/* ===== 入力欄 ===== */

.search-input,
input,
textarea,
select{

  background:#08130f !important;

  color:#effff8 !important;

  border:1px solid #205f4b !important;

  border-radius:12px !important;
}

.search-input::placeholder,
input::placeholder,
textarea::placeholder{
  color:#718f84;
}


/* ===== 検索 ===== */

.search-button{

  background:
    linear-gradient(
      135deg,
      #047857,
      #10b981
    );

  color:white;

  border:none;

  border-radius:11px;

  font-weight:950;

  box-shadow:
    0 6px 20px rgba(16,185,129,.2);
}


/* ===== 検索クリア ===== */

.clear-button{

  background:#121e19;

  color:#b8d2c8;

  border:1px solid #29463b;

  border-radius:11px;
}


/* ===== カテゴリー ===== */

.categories{
  gap:10px;
}


.category{

  background:
    linear-gradient(
      145deg,
      #10241b,
      #09140f
    );

  color:#d0e8df;

  border:1px solid #205340;

  border-radius:15px;

  padding:16px 8px;

  box-shadow:
    0 7px 20px rgba(0,0,0,.25);

  transition:.2s;
}


.category.active{

  background:
    linear-gradient(
      135deg,
      #047857,
      #10b981
    );

  color:white;

  border-color:#34d399;

  box-shadow:
    0 8px 24px rgba(16,185,129,.28);
}


/* ===== 投稿カード ===== */

.post{

  position:relative;

  background:
    linear-gradient(
      145deg,
      #10231b,
      #07110d
    );

  color:#edfff8;

  border:1px solid #1b5542;

  border-radius:18px;

  padding:18px;

  box-shadow:
    0 12px 32px rgba(0,0,0,.38);

  overflow:hidden;
}


/* 左側のエメラルドライン */

.post::before{

  content:"";

  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:3px;

  background:
    linear-gradient(
      180deg,
      #34d399,
      #047857
    );
}


/* ===== カテゴリータグ ===== */

.post-category{

  background:#12382b;

  color:#6ff0b8;

  border:1px solid #22664d;

  border-radius:999px;

  padding:5px 10px;

  font-weight:900;
}


/* ===== 投稿者 ===== */

.post-author{
  color:#9fbab0;
  font-weight:800;
}


/* ===== 場所 ===== */

.post-location{
  color:#87a69a;
}


/* ===== 投稿タイトル ===== */

.post h3{

  color:#ffffff;

  font-size:18px;

  font-weight:950;

  letter-spacing:.2px;
}


/* ===== 投稿本文 ===== */

.post p{

  color:#d4e8df;

  line-height:1.7;
}


/* ===== いいね・返信 ===== */

.reply-button{

  background:
    linear-gradient(
      135deg,
      #087f58,
      #16c978
    );

  color:white;

  border:none;

  border-radius:10px;

  box-shadow:
    0 5px 16px rgba(16,185,129,.2);
}


.like-button{

  background:
    linear-gradient(
      135deg,
      #087f58,
      #16c978
    );

  color:white;

  border:none;

  border-radius:10px;

  padding:9px 12px;

  font-weight:900;
}


.like-button.liked{

  background:#14231c;

  color:#67e8b5;

  border:1px solid #2aa876;
}


/* ===== 返信エリア ===== */

.reply-area{

  border-top:1px solid #1b3c30;
}


.reply{

  background:#0a1511;

  border:1px solid #18382c;

  border-radius:10px;
}


.reply-author{
  color:#8fb4a5;
}


.reply-body{
  color:#d6e9e1;
}


.reply-date{
  color:#6f8980;
}


/* ===== 通報 ===== */

.report-button{

  background:#151b18;

  color:#ff8989;

  border:1px solid #4b2929;

  border-radius:9px;
}


/* ===== 都道府県フィルター ===== */

.filter-box{

  background:
    linear-gradient(
      145deg,
      #10221a,
      #09130f
    );

  border:1px solid #1d5541;

  border-radius:15px;

  color:#e2f5ed;
}


.sort-box{

  background:#102019;

  border:1px solid #1d5541;

  color:#bde0d3;

  border-radius:14px;
}


/* ===== 新着投稿 ===== */

.section-title h2{

  color:#ffffff;

  font-weight:950;
}


.section-title h2::first-letter{
  color:#34d399;
}


.section-title span{
  color:#69e7b1;
}


/* ===== モーダル ===== */

.modal{

  background:rgba(0,0,0,.78);

  backdrop-filter:blur(7px);
}


.modal-box{

  background:
    linear-gradient(
      145deg,
      #10231b,
      #06100c
    );

  color:#effff8;

  border:1px solid #27654d;

  border-radius:20px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.65);
}


.submit{

  background:
    linear-gradient(
      135deg,
      #047857,
      #10b981,
      #34d399
    );

  border-radius:12px;

  font-weight:950;
}


.close{

  background:#151e1a;

  color:#bfd3ca;

  border:1px solid #2b4539;

  border-radius:11px;
}


/* ===== スクロールバー ===== */

::-webkit-scrollbar{
  width:6px;
}

::-webkit-scrollbar-track{
  background:#040807;
}

::-webkit-scrollbar-thumb{
  background:#176247;
  border-radius:10px;
}


/* ===== スマホ ===== */

@media(max-width:600px){

  header{
    padding:28px 14px 25px;
  }

  header h1{
    font-size:25px;
  }

  header h1::before{
    font-size:27px;
  }

  .container{
    padding:14px 11px 30px;
  }

  .categories{
    grid-template-columns:repeat(2,1fr);
  }

  .category{
    min-height:64px;
  }

  .post{
    padding:16px;
  }

  .post h3{
    font-size:17px;
  }
}


*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;

}

}

}


/* 検索 */

.search-box{
  background:white;
  padding:12px;
  border-radius:12px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.search-input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:9px;
  font-size:16px;
  margin:0;
}

.search-button{
  width:100%;
  margin-top:8px;
  padding:13px;
  border:0;
  border-radius:9px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.clear-button{
  width:100%;
  margin-top:8px;
  padding:11px;
  border:0;
  border-radius:9px;
  background:#e5e7eb;

  font-size:14px;
}


/* カテゴリー */

.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:20px;
}

.category{
  background:white;
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px 8px;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
}

.category.active{
  background:#2563eb;
  color:white;
  border-color:#2563eb;
}


/* 投稿 */

.post{
  background:white;
  border-radius:12px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.post-category{
  display:inline-block;
  background:#e5e7eb;
  border-radius:20px;
  padding:4px 9px;
  font-size:12px;
  margin-bottom:8px;
}

.post-author{
  font-size:13px;
  font-weight:bold;
  color:#555;
  margin-bottom:5px;
}

.post h3{
  margin:5px 0;
  font-size:17px;
}

.post p{
  margin:8px 0;
  line-height:1.6;
}

.post small{
  color:#777;
}


/* 返信 */

.reply-area{
  margin-top:14px;
  border-top:1px solid #eee;
  padding-top:12px;
}

.reply-title{
  font-weight:bold;
  font-size:14px;
  margin-bottom:8px;
}

.reply{
  background:#f8fafc;
  border-radius:9px;
  padding:10px;
  margin-top:7px;
}

.reply-author{
  font-size:12px;
  font-weight:bold;
  color:#555;
}

.reply-body{
  margin-top:4px;
  font-size:14px;
  line-height:1.5;
}

.reply-date{
  font-size:11px;
  color:#888;
  margin-top:4px;
}

.reply-button{
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#e5e7eb;
  padding:9px 13px;
  font-size:13px;
  font-weight:bold;
}

.reply-form{
  display:none;
  margin-top:10px;
}

.reply-form input,
.reply-form textarea{
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
  margin-bottom:8px;
}

.reply-form textarea{
  min-height:80px;
}

.reply-submit{
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  padding:10px 14px;
  font-weight:bold;
}


/* 通報 */

.report-button{
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#fee2e2;
  color:#b91c1c;
  padding:9px 13px;
  font-size:13px;
  font-weight:bold;
}

.report-form{
  display:none;
  margin-top:10px;
  padding:12px;
  background:#fff7f7;
  border-radius:10px;
  border:1px solid #fecaca;
}

.report-form select,
.report-form input{
  width:100%;
  padding:10px;
  margin-bottom:8px;
  border:1px solid #ccc;
  border-radius:8px;
}

.report-submit{
  border:0;
  border-radius:8px;
  background:#dc2626;
  color:white;
  padding:10px 14px;
  font-weight:bold;
}


/* モーダル */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  padding:20px;
  z-index:10;
  overflow-y:auto;
}

.modal-box{
  background:white;
  max-width:600px;
  margin:40px auto;
  padding:20px;
  border-radius:16px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  margin:7px 0 14px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

textarea{
  min-height:120px;
}

.submit{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.submit:disabled{
  opacity:.6;
}

.close{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  background:#eee;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px 10px;
}

.status{
  text-align:center;
  font-size:13px;
  color:#777;
  margin:10px;
}

<script type="module">

import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://rwhsxtzzpwddkmtjszzc.supabase.co";


const SUPABASE_KEY =
"sb_publishable_0H09q8OgCLAVQIgQZ_VQkQ_RfPFB_hS";


const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let currentCategory =
"すべて";

let currentSearch =
"";
let currentPrefecture =
"すべて";
let likedPosts = new Set();
/* =========================
   安全処理
========================= */

function escapeHtml(text){

return String(text ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


function formatText(text){

return escapeHtml(text)
.replace(/\n/g,"<br>");

}


function formatDate(date){

return new Date(date)
.toLocaleString("ja-JP");

}


/* =========================
   カテゴリー
========================= */

window.filterCategory =
function(category){

currentCategory =
category;


document
.querySelectorAll(".category")
.forEach(button => {

button.classList.toggle(
"active",
button.dataset.category === category
);

});


loadPosts();

};


/* =========================
   検索
========================= */

window.searchPosts =
function(){

currentSearch =
document
.getElementById("search")
.value
.trim()
.toLowerCase();


loadPosts();

};


window.clearSearch =
function(){

document
.getElementById("search")
.value = "";


currentSearch = "";


loadPosts();

};
/* =========================
   都道府県フィルター
========================= */

window.filterPrefecture =
function(){

currentPrefecture =
document
.getElementById("prefecture-filter")
.value;


loadPosts();

};

/* =========================
   投稿読み込み
========================= */

async function loadPosts(){

const status =
document.getElementById("status");

const area =
document.getElementById("posts");


status.textContent =
"投稿を読み込み中...";


const {
data:posts,
error
} =
await supabase

.from("posts")

.select("*")

.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(error);


status.textContent =
"投稿の読み込みに失敗しました";


area.innerHTML =
'<div class="empty">' +
'データベース接続エラー' +
'</div>';


return;

}


/* カテゴリー */

let filteredPosts =

currentCategory === "すべて"

? posts

: posts.filter(
post =>
post.category === currentCategory
);
/* 都道府県 */

if(currentPrefecture !== "すべて"){

filteredPosts =
filteredPosts.filter(
post =>
post.prefecture === currentPrefecture
);

}

/* 検索 */

if(currentSearch){

filteredPosts =
filteredPosts.filter(
post => {

const text = (

(post.author || "") +
" " +
(post.title || "") +
" " +
(post.body || "") +
" " +
(post.category || "")

).toLowerCase();


return text.includes(
currentSearch
);

});

}


status.textContent =
filteredPosts.length +
"件の投稿";


if(filteredPosts.length === 0){

area.innerHTML =
'<div class="empty">' +
'条件に一致する投稿がありません。' +
'</div>';

return;

}


const postIds =
filteredPosts.map(
post => post.id
);


/* 返信 */

const {
data:replies,
error:replyError
} =
await supabase

.from("replies")

.select("*")

.in("post_id",postIds)

.order(
"created_at",
{
ascending:true
}
);


if(replyError){

console.error(replyError);

}


const replyList =
replies || [];


/* 投稿表示 */

area.innerHTML =

filteredPosts.map(
post => {


const postReplies =
replyList.filter(

reply =>
String(reply.post_id) ===
String(post.id)

);


/* 返信表示 */

const repliesHtml =

postReplies.length === 0

?

'<div style="color:#888;font-size:13px;">' +
'まだ返信はありません' +
'</div>'

:

postReplies.map(
reply => `

<div class="reply">

<div class="reply-author">

👤 ${escapeHtml(
reply.author ||
"名無しのトラック運転手"
)}

</div>


<div class="reply-body">

${formatText(
reply.body
)}

</div>


<div class="reply-date">

${formatDate(
reply.created_at
)}

</div>


<button
class="report-button"
onclick="toggleReplyReport('${reply.id}')"
>
🚨 返信を通報
</button>


<div
class="report-form"
id="reply-report-${reply.id}"
>

<select
id="reply-reason-${reply.id}"
>

<option value="">
通報理由を選択
</option>

<option>
迷惑投稿・荒らし
</option>

<option>
誹謗中傷
</option>

<option>
広告・宣伝
</option>

<option>
その他
</option>

</select>


<input
id="reply-reporter-${reply.id}"
maxlength="30"
placeholder="名前（任意）"
>


<button
class="report-submit"
onclick="reportReply('${reply.id}')"
>
通報する
</button>

</div>

</div>

`
).join("");


return `

<div class="post">


<span class="post-category">

${escapeHtml(
post.category
)}

</span>

window.addPost =
async function(){

const {
data:{
user
}
} =
await supabase.auth.getUser();


/* ログイン確認 */

if(!user){

alert(
"投稿するにはログインしてください🚛"
);

openAuthModal();

return;

}


const author =
document
.getElementById("author")
.value
.trim();


const category =
document
.getElementById("category")
.value;


const prefecture =
document
.getElementById("prefecture")
.value;


const title =
document
.getElementById("title")
.value
.trim();


const body =
document
.getElementById("body")
.value
.trim();


if(!author){

alert(
"ニックネームを入力してください"
);

return;

}


if(!title || !body){

alert(
"タイトルと本文を入力してください"
);

return;

}


const button =
document.querySelector("#modal .submit");


button.disabled =
true;


button.textContent =
"投稿中...";


/* 投稿 */

const {error} =
await supabase

.from("posts")

.insert({

user_id:user.id,

author:author,

category:category,

prefecture:prefecture,

title:title,

body:body

});


button.disabled =
false;


button.textContent =
"投稿する";


if(error){

console.error(error);


alert(
"投稿に失敗しました。\n" +
error.message
);

return;

}


/* 入力クリア */

document
.getElementById("author")
.value = "";


document
.getElementById("title")
.value = "";


document
.getElementById("body")
.value = "";


closeModal();


alert(
"投稿しました！🚛"
);


await loadPosts();

};

window.likePost = async function(postId){

  const likeKey = "liked_post_" + postId;

  // すでにいいね済みか確認
  if(localStorage.getItem(likeKey) === "true"){
    alert("この投稿には、すでにいいねしています👍");
    return;
  }

  const { error } = await supabase.rpc(
    "increment_post_likes",
    {
      post_id_input: postId
    }
  );

  if(error){
    console.error(error);

    alert(
      "いいねに失敗しました。\n" +
      error.message
    );

    return;
  }

  // いいね済みとして保存
  localStorage.setItem(likeKey, "true");

  alert("👍 いいねしました！");

  loadPosts();
};

window.toggleReplyForm =
async function(postId){

  /* ログイン確認 */

  const {
    data:{
      user
    }
  } = await supabase.auth.getUser();


  if(!user){

    alert(
      "返信するにはログインしてください🚛"
    );

    openAuthModal();

    return;

  }


  const form =
    document.getElementById(
      "reply-form-" + postId
    );


  /* 閉じる */

  if(form.style.display === "block"){

    form.style.display = "none";

    return;

  }


  /* プロフィール取得 */

  const {
    data:profile,
    error
  } = await supabase

    .from("profiles")

    .select("nickname")

    .eq("id",user.id)

    .maybeSingle();


  if(error){

    console.error(
      "プロフィール取得エラー:",
      error
    );

  }


  /* ニックネーム自動入力 */

  const authorInput =
    document.getElementById(
      "reply-author-" + postId
    );


  if(profile && profile.nickname){

    authorInput.value =
      profile.nickname;

  }


  form.style.display =
    "block";

};

window.addReply =
async function(postId){

  /* =========================
     ログイン確認
  ========================= */

  const {
    data:{
      user
    }
  } = await supabase.auth.getUser();


  if(!user){

    alert(
      "返信するにはログインしてください🚛"
    );

    openAuthModal();

    return;

  }


  /* =========================
     プロフィール取得
  ========================= */

  const {
    data:profile,
    error:profileError
  } = await supabase

    .from("profiles")

    .select("nickname")

    .eq("id",user.id)

    .maybeSingle();


  if(profileError){

    console.error(
      "プロフィール取得エラー:",
      profileError
    );

    alert(
      "プロフィールの取得に失敗しました。\n" +
      profileError.message
    );

    return;

  }


  /* =========================
     ニックネーム確認
  ========================= */

  if(!profile || !profile.nickname){

    alert(
      "返信する前にプロフィールのニックネームを設定してください👤"
    );

    openProfileModal();

    return;

  }


  /* =========================
     本文取得
  ========================= */

  const bodyInput =
    document.getElementById(
      "reply-body-" + postId
    );


  const body =
    bodyInput.value.trim();


  if(!body){

    alert(
      "返信内容を入力してください"
    );

    return;

  }


  /* =========================
     返信ボタン取得
  ========================= */

  const form =
    document.getElementById(
      "reply-form-" + postId
    );


  const button =
    form.querySelector(
      ".reply-submit"
    );


  button.disabled = true;

  button.textContent =
    "返信中...";


  /* =========================
     返信投稿
  ========================= */

  /* =========================
   返信投稿
========================= */

const {error} =
await supabase
.from("replies")
.insert({

  post_id: postId,

  user_id: user.id,

  author: profile.nickname,

  body: body

});


  /* =========================
     ボタン復帰
  ========================= */

  button.disabled = false;

  button.textContent =
    "返信を投稿";


  /* =========================
     エラー
  ========================= */

  if(error){

    console.error(
      "返信投稿エラー:",
      error
    );

    alert(
      "返信に失敗しました。\n" +
      error.message
    );

    return;

  }


  /* =========================
     入力クリア
  ========================= */

  bodyInput.value = "";


  /* ニックネームもプロフィールから自動なので
     フォームを閉じる */

  if(form){

    form.style.display =
      "none";

  }


  alert(
    "返信しました！🚛"
  );


  /* =========================
     投稿再読み込み
  ========================= */

  await loadPosts();

};

async function loadProfileToPostForm(){

  const {
    data:{
      user
    }
  } = await supabase.auth.getUser();

  if(!user){
    return;
  }

  const {
    data:profile,
    error
  } = await supabase
    .from("profiles")
    .select("nickname,prefecture")
    .eq("id",user.id)
    .maybeSingle();

  if(error){
    console.error("プロフィール取得エラー:", error);
    return;
  }

  if(profile){

    const authorInput =
      document.getElementById("author");

    const prefectureInput =
      document.getElementById("prefecture");

    if(authorInput && profile.nickname){
      authorInput.value = profile.nickname;
    }

    if(prefectureInput && profile.prefecture){
      prefectureInput.value = profile.prefecture;
    }

  }

}

window.loginUser =
async function(){

const email =
document
.getElementById("auth-email")
.value
.trim();

const password =
document
.getElementById("auth-password")
.value;


if(!email || !password){

alert("メールアドレスとパスワードを入力してください");

return;

}


const button =
document
.getElementById("login-button");


button.disabled = true;

button.textContent = "ログイン中...";


const { error } =
await supabase.auth.signInWithPassword({

email: email,

password: password

});


button.disabled = false;

button.textContent = "ログイン";


if(error){

console.error(error);

alert(
"ログインに失敗しました。\n" +
error.message
);

return;

}


alert("ログインしました！🚛");

closeAuthModal();

updateAuthArea();

};


/* =========================

window.signupUser =
async function(){

const email =
document
.getElementById("auth-email")
.value
.trim();

const password =
document
.getElementById("auth-password")
.value;


if(!email || !password){

alert(
"メールアドレスとパスワードを入力してください"
);

return;

}


if(password.length < 6){

alert(
"パスワードは6文字以上にしてください"
);

return;

}


const button =
document
.getElementById("signup-button");


button.disabled = true;

button.textContent = "登録中...";


const { data, error } =
await supabase.auth.signUp({

email: email,

password: password

});


button.disabled = false;

button.textContent = "新規登録はこちら";


if(error){

console.error(error);

alert(
"登録に失敗しました。\n" +
error.message
);

return;

}


if(data.session){

alert(
"新規登録が完了しました！🚛"
);

closeAuthModal();

}else{

alert(
"登録しました！\n" +
"確認メールが必要な設定の場合は、メールを確認してください。"
);

}

};

window.saveProfile =
async function(){

const {
data:{
user
}
} =
await supabase.auth.getUser();


if(!user){

alert("ログインしてください");

return;

}


const nickname =
document
.getElementById("profile-nickname")
.value
.trim();


const prefecture =
document
.getElementById("profile-prefecture")
.value;


const truckType =
document
.getElementById("profile-truck-type")
.value;


const bio =
document
.getElementById("profile-bio")
.value
.trim();


if(!nickname){

alert(
"ニックネームを入力してください"
);

return;

}


const button =
document.querySelector(
"#profile-modal .submit"
);

button.disabled = true;

button.textContent =
"保存中...";


const {error} =
await supabase

.from("profiles")

.upsert({

id:user.id,

nickname:nickname,

prefecture:prefecture || null,

truck_type:truckType || null,

bio:bio || null,

updated_at:new Date().toISOString()

});

button.textContent =
"プロフィールを保存";


if(error){

console.error(error);

alert(
"プロフィールの保存に失敗しました。\n" +
error.message
);

return;

}


alert(
"プロフィールを保存しました！🚛"
);


closeProfileModal();

updateAuthArea();

};
