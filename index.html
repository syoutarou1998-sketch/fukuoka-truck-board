<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>福岡トラック掲示板</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  background:#f3f5f7;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:24px 16px;
  text-align:center;
}

header h1{
  margin:0 0 8px;
  font-size:25px;
}

header p{
  margin:0;
  font-size:13px;
  opacity:.8;
}

.container{
  max-width:700px;
  margin:auto;
  padding:16px;
}

.post-button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
  margin-bottom:14px;
}


/* 検索 */

.search-box{
  background:white;
  padding:12px;
  border-radius:12px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.search-input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:9px;
  font-size:16px;
  margin:0;
}

.search-button{
  width:100%;
  margin-top:8px;
  padding:13px;
  border:0;
  border-radius:9px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.clear-button{
  width:100%;
  margin-top:8px;
  padding:11px;
  border:0;
  border-radius:9px;
  background:#e5e7eb;
  color:#222;
  font-size:14px;
}


/* カテゴリー */

.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:20px;
}

.category{
  background:white;
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px 8px;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
}

.category.active{
  background:#2563eb;
  color:white;
  border-color:#2563eb;
}


/* 投稿 */

.post{
  background:white;
  border-radius:12px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.post-category{
  display:inline-block;
  background:#e5e7eb;
  border-radius:20px;
  padding:4px 9px;
  font-size:12px;
  margin-bottom:8px;
}

.post-author{
  font-size:13px;
  font-weight:bold;
  color:#555;
  margin-bottom:5px;
}

.post h3{
  margin:5px 0;
  font-size:17px;
}

.post p{
  margin:8px 0;
  line-height:1.6;
}

.post small{
  color:#777;
}


/* 返信 */

.reply-area{
  margin-top:14px;
  border-top:1px solid #eee;
  padding-top:12px;
}

.reply-title{
  font-weight:bold;
  font-size:14px;
  margin-bottom:8px;
}

.reply{
  background:#f8fafc;
  border-radius:9px;
  padding:10px;
  margin-top:7px;
}

.reply-author{
  font-size:12px;
  font-weight:bold;
  color:#555;
}

.reply-body{
  margin-top:4px;
  font-size:14px;
  line-height:1.5;
}

.reply-date{
  font-size:11px;
  color:#888;
  margin-top:4px;
}

.reply-button{
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#e5e7eb;
  padding:9px 13px;
  font-size:13px;
  font-weight:bold;
}

.reply-form{
  display:none;
  margin-top:10px;
}

.reply-form input,
.reply-form textarea{
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
  margin-bottom:8px;
}

.reply-form textarea{
  min-height:80px;
}

.reply-submit{
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  padding:10px 14px;
  font-weight:bold;
}


/* 通報 */

.report-button{
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#fee2e2;
  color:#b91c1c;
  padding:9px 13px;
  font-size:13px;
  font-weight:bold;
}

.report-form{
  display:none;
  margin-top:10px;
  padding:12px;
  background:#fff7f7;
  border-radius:10px;
  border:1px solid #fecaca;
}

.report-form select,
.report-form input{
  width:100%;
  padding:10px;
  margin-bottom:8px;
  border:1px solid #ccc;
  border-radius:8px;
}

.report-submit{
  border:0;
  border-radius:8px;
  background:#dc2626;
  color:white;
  padding:10px 14px;
  font-weight:bold;
}


/* モーダル */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  padding:20px;
  z-index:10;
}

.modal-box{
  background:white;
  max-width:600px;
  margin:40px auto;
  padding:20px;
  border-radius:16px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  margin:7px 0 14px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

textarea{
  min-height:120px;
}

.submit{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.submit:disabled{
  opacity:.6;
}

.close{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  background:#eee;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px 10px;
}

.status{
  text-align:center;
  font-size:13px;
  color:#777;
  margin:10px;
}

</style>
</head>


<body>

<header>

<h1>🚛 福岡トラック掲示板</h1>

<p>
福岡のトラックドライバー・運送業界の情報交換
</p>

</header>


<div class="container">


<button
class="post-button"
onclick="openModal()"
>
＋ 投稿する
</button>


<!-- 検索 -->

<div class="search-box">

<input
id="search"
class="search-input"
type="search"
placeholder="4t・大型・トレーラー・求人など"
>

<button
class="search-button"
onclick="searchPosts()"
>
🔍 検索
</button>

<button
class="clear-button"
onclick="clearSearch()"
>
検索をクリア
</button>

</div>


<!-- カテゴリー -->

<div class="categories">

<div
class="category active"
data-category="すべて"
onclick="filterCategory('すべて')"
>
📋 すべて
</div>

<div
class="category"
data-category="求人・仕事募集"
onclick="filterCategory('求人・仕事募集')"
>
💼 求人・仕事募集
</div>

<div
class="category"
data-category="運送情報"
onclick="filterCategory('運送情報')"
>
🚛 運送情報
</div>

<div
class="category"
data-category="道路・待機場所"
onclick="filterCategory('道路・待機場所')"
>
🛣️ 道路・待機場所
</div>

<div
class="category"
data-category="雑談"
onclick="filterCategory('雑談')"
>
💬 雑談
</div>

</div>


<div
id="status"
class="status"
>
投稿を読み込み中...
</div>


<div id="posts"></div>

</div>



<!-- 投稿モーダル -->

<div
class="modal"
id="modal"
>

<div class="modal-box">

<h2>投稿する</h2>

<label>ニックネーム</label>

<input
id="author"
type="text"
maxlength="30"
placeholder="例：福岡トラック太郎"
>


<label>カテゴリ</label>

<select id="category">

<option>求人・仕事募集</option>

<option>運送情報</option>

<option>道路・待機場所</option>

<option>雑談</option>

</select>


<label>タイトル</label>

<input
id="title"
type="text"
maxlength="100"
placeholder="タイトルを入力"
>


<label>本文</label>

<textarea
id="body"
maxlength="2000"
placeholder="内容を入力"
></textarea>


<button
class="submit"
onclick="addPost()"
>
投稿する
</button>


<button
class="close"
onclick="closeModal()"
>
キャンセル
</button>

</div>

</div>



<script type="module">


import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://rwhsxtzzpwddkmtjszzc.supabase.co";


const SUPABASE_KEY =
"sb_publishable_0H09q8OgCLAVQIgQZ_VQkQ_RfPFB_hS";


const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let currentCategory =
"すべて";

let currentSearch =
"";


/* =========================
   安全処理
========================= */

function escapeHtml(text){

return String(text ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


function formatText(text){

return escapeHtml(text)
.replace(/\n/g,"<br>");

}


function formatDate(date){

return new Date(date)
.toLocaleString("ja-JP");

}


/* =========================
   カテゴリー
========================= */

window.filterCategory =
function(category){

currentCategory =
category;


document
.querySelectorAll(".category")
.forEach(button => {

button.classList.toggle(

"active",

button.dataset.category ===
category

);

});


loadPosts();

};


/* =========================
   検索
========================= */

window.searchPosts =
function(){

currentSearch =

document
.getElementById("search")
.value
.trim()
.toLowerCase();


loadPosts();

};


window.clearSearch =
function(){

document
.getElementById("search")
.value = "";


currentSearch = "";


loadPosts();

};


/* =========================
   投稿読み込み
========================= */

async function loadPosts(){

const status =
document.getElementById("status");

const area =
document.getElementById("posts");


status.textContent =
"投稿を読み込み中...";


const {
data:posts,
error
} =
await supabase

.from("posts")

.select("*")

.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(error);


status.textContent =
"投稿の読み込みに失敗しました";


area.innerHTML =
'<div class="empty">' +
'データベース接続エラー' +
'</div>';


return;

}


/* カテゴリー */

let filteredPosts =

currentCategory === "すべて"

? posts

: posts.filter(

post =>
post.category ===
currentCategory

);


/* 検索 */

if(currentSearch){

filteredPosts =
filteredPosts.filter(
post => {

const text = (

(post.author || "") +
" " +
(post.title || "") +
" " +
(post.body || "") +
" " +
(post.category || "")

).toLowerCase();


return text.includes(
currentSearch
);

});

}


status.textContent =
filteredPosts.length +
"件の投稿";


if(filteredPosts.length === 0){

area.innerHTML =
'<div class="empty">' +
'条件に一致する投稿がありません。' +
'</div>';

return;

}


const postIds =
filteredPosts.map(
post => post.id
);


/* 返信 */

const {
data:replies,
error:replyError
} =
await supabase

.from("replies")

.select("*")

.in("post_id",postIds)

.order(
"created_at",
{
ascending:true
}
);


if(replyError){

console.error(replyError);

}


const replyList =
replies || [];


/* 投稿表示 */

area.innerHTML =

filteredPosts.map(
post => {


const postReplies =
replyList.filter(

reply =>

String(reply.post_id) ===
String(post.id)

);


/* 返信表示 */

const repliesHtml =

postReplies.length === 0

?

'<div style="color:#888;font-size:13px;">' +
'まだ返信はありません' +
'</div>'

:

postReplies.map(
reply => `

<div class="reply">

<div class="reply-author">

👤 ${escapeHtml(

reply.author ||
"名無しのトラック運転手"

)}

</div>


<div class="reply-body">

${formatText(
reply.body
)}

</div>


<div class="reply-date">

${formatDate(
reply.created_at
)}

</div>


<button
class="report-button"
onclick=
"toggleReplyReport('${reply.id}')"
>
🚨 返信を通報
</button>


<div
class="report-form"
id=
"reply-report-${reply.id}"
>

<select
id=
"reply-reason-${reply.id}"
>

<option value="">
通報理由を選択
</option>

<option>
迷惑投稿・荒らし
</option>

<option>
誹謗中傷
</option>

<option>
広告・宣伝
</option>

<option>
その他
</option>

</select>


<input
id=
"reply-reporter-${reply.id}"
maxlength="30"
placeholder="名前（任意）"
>


<button
class="report-submit"
onclick=
"reportReply('${reply.id}')"
>
通報する
</button>

</div>

</div>

`
).join("");


return `

<div class="post">


<span class="post-category">

${escapeHtml(
post.category
)}

</span>


<div class="post-author">

👤 ${escapeHtml(

post.author ||
"名無しのトラック運転手"

)}

</div>


<h3>

${escapeHtml(
post.title
)}

</h3>


<p>

${formatText(
post.body
)}

</p>


<small>

${formatDate(
post.created_at
)}

</small>


<button
class="report-button"
onclick=
"togglePostReport('${post.id}')"
>
🚨 この投稿を通報
</button>


<div
class="report-form"
id=
"post-report-${post.id}"
>

<select
id=
"post-reason-${post.id}"
>

<option value="">
通報理由を選択
</option>

<option>
迷惑投稿・荒らし
</option>

<option>
誹謗中傷
</option>

<option>
広告・宣伝
</option>

<option>
その他
</option>

</select>


<input
id=
"post-reporter-${post.id}"
maxlength="30"
placeholder="名前（任意）"
>


<button
class="report-submit"
onclick=
"reportPost('${post.id}')"
>
通報する
</button>

</div>


<div class="reply-area">


<div class="reply-title">

💬 返信
${postReplies.length}件

</div>


${repliesHtml}


<button
class="reply-button"
onclick=
"toggleReplyForm('${post.id}')"
>

＋ 返信する

</button>


<div
class="reply-form"
id=
"reply-form-${post.id}"
>


<input
id=
"reply-author-${post.id}"
type="text"
maxlength="30"
placeholder="ニックネーム"
>


<textarea
id=
"reply-body-${post.id}"
maxlength="1000"
placeholder="返信内容"
></textarea>


<button
class="reply-submit"
onclick=
"addReply('${post.id}')"
>

返信を投稿

</button>


</div>


</div>


</div>

`;

}

).join("");

}


/* =========================
   投稿
========================= */

window.addPost =
async function(){

const author =
document
.getElementById("author")
.value
.trim();


const category =
document
.getElementById("category")
.value;


const title =
document
.getElementById("title")
.value
.trim();


const body =
document
.getElementById("body")
.value
.trim();


if(!author){

alert(
"ニックネームを入力してください"
);

return;

}


if(!title || !body){

alert(
"タイトルと本文を入力してください"
);

return;

}


const button =
document.querySelector(".submit");


button.disabled =
true;


button.textContent =
"投稿中...";


const {error} =

await supabase

.from("posts")

.insert({

author:author,

category:category,

title:title,

body:body

});


button.disabled =
false;


button.textContent =
"投稿する";


if(error){

console.error(error);


alert(
"投稿に失敗しました。\n" +
error.message
);

return;

}


document
.getElementById("author")
.value = "";


document
.getElementById("title")
.value = "";


document
.getElementById("body")
.value = "";


closeModal();


await loadPosts();

};


/* =========================
   返信フォーム
========================= */

window.toggleReplyForm =
function(postId){

const form =
document.getElementById(
"reply-form-" + postId
);


form.style.display =

form.style.display === "block"

? "none"

: "block";

};


/* =========================
   返信
========================= */

window.addReply =
async function(postId){

const author =
document.getElementById(
"reply-author-" + postId
)
.value
.trim();


const body =
document.getElementById(
"reply-body-" + postId
)
.value
.trim();


if(!author){

alert(
"ニックネームを入力してください"
);

return;

}


if(!body){

alert(
"返信内容を入力してください"
);

return;

}


const {error} =

await supabase

.from("replies")

.insert({

post_id:postId,

author:author,

body:body

});


if(error){

console.error(error);


alert(
"返信に失敗しました。\n" +
error.message
);

return;

}


await loadPosts();

};


/* =========================
   投稿通報フォーム
========================= */

window.togglePostReport =
function(postId){

const form =
document.getElementById(
"post-report-" + postId
);


form.style.display =

form.style.display === "block"

? "none"

: "block";

};


/* =========================
   返信通報フォーム
========================= */

window.toggleReplyReport =
function(replyId){

const form =
document.getElementById(
"reply-report-" + replyId
);


form.style.display =

form.style.display === "block"

? "none"

: "block";

};


/* =========================
   投稿を通報
========================= */

window.reportPost =
async function(postId){

const reason =
document.getElementById(
"post-reason-" + postId
)
.value;


const reporter =
document.getElementById(
"post-reporter-" + postId
)
.value
.trim() ||
"匿名";


if(!reason){

alert(
"通報理由を選択してください"
);

return;

}


const {error} =

await supabase

.from("reports")

.insert({

post_id:postId,

reason:reason,

reporter_name:reporter

});


if(error){

console.error(error);


alert(
"通報に失敗しました。\n" +
error.message
);

return;

}


alert(
"通報を受け付けました。"
);


document.getElementById(
"post-report-" + postId
).style.display =
"none";

};


/* =========================
   返信を通報
========================= */

window.reportReply =
async function(replyId){

const reason =
document.getElementById(
"reply-reason-" + replyId
)
.value;


const reporter =
document.getElementById(
"reply-reporter-" + replyId
)
.value
.trim() ||
"匿名";


if(!reason){

alert(
"通報理由を選択してください"
);

return;

}


const {error} =

await supabase

.from("reports")

.insert({

reply_id:replyId,

reason:reason,

reporter_name:reporter

});


if(error){

console.error(error);


alert(
"通報に失敗しました。\n" +
error.message
);

return;

}


alert(
"通報を受け付けました。"
);


document.getElementById(
"reply-report-" + replyId
).style.display =
"none";

};


/* =========================
   モーダル
========================= */

window.openModal =
function(){

document
.getElementById("modal")
.style.display =
"block";

};


window.closeModal =
function(){

document
.getElementById("modal")
.style.display =
"none";

};


/* =========================
   開始
========================= */

loadPosts();

</script>

</body>
</html>
